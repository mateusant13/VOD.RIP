name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
          npm ci
      # Self-diagnosing on purpose. This step has failed on every one of the 40
      # runs the GitHub API returned - zero successes - while the SAME command
      # passes locally (exit 0, 177/177 packages, 10848 files). The job log
      # needs auth to read, so the failure has been opaque; --json prints the
      # exact missing package, the .bin state and the file count, which is what
      # makes the next red run diagnosable instead of mysterious.
      - name: Verify node_modules is complete
        run: |
          npm run verify:install || {
            echo "::error::node_modules incomplete - diagnosis follows"
            node scripts/check-node-install.mjs --json
            exit 1
          }
      - name: Type-check frontend
        # `npm run typecheck` runs the guard first and then the LOCAL tsc shim.
        # Do NOT use `npx tsc` here: with node_modules/.bin missing, npx fetches
        # a TypeScript from the network or a global install and reports success
        # against a tree that never compiled anything.
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check backend/
      - name: Lint Python (lock contract)
        run: |
          cd backend
          python scripts/lock_lint.py services/download_manager.py
      - name: Python syntax check
        run: python -m compileall -q backend
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      - name: Verify requirements.lock is up-to-date
        run: |
          pip install pip-tools
          pip-compile --strip-extras backend/requirements.txt -o /tmp/requirements-check.txt 2>/dev/null || true
          # Diff only the package names+versions (strip comments/whitespace)
          diff <(grep -E "^[a-zA-Z]" requirements.lock | sort) <(grep -E "^[a-zA-Z]" /tmp/requirements-check.txt | sort) || echo "::warning::requirements.lock may be out of sync with requirements.txt"
      - name: Playwright e2e smoke test
        if: always()
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e 2>&1 || echo "::warning::Playwright e2e had failures (non-blocking)"

  e2e-frame-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci
      - name: Playwright frame-mode + live-badge e2e
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e:frame-live
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller pywebview pystray Pillow
          npm ci

      - name: Install GPU ASR runtime deps (best-effort)
        continue-on-error: true
        shell: pwsh
        run: |
          # Swaps the CPU sherpa-onnx for the +cuda wheel and pulls the nvidia
          # cu12 runtime libs so vod-rip-asr.spec ships a GPU-capable runtime.
          # Best-effort: `_asr_gpu_binaries()` degrades to the CPU EP if the
          # wheel download fails, so the base build is never blocked.
          python -m pip install -r backend/requirements-gpu.txt

      - name: Build frontend and frozen bundle
        shell: pwsh
        run: |
          npm run build-copy
          python scripts/generate-icon.py
          pyinstaller vod-rip.spec --clean --noconfirm
          node scripts/deploy-dist.mjs
          node scripts/stage-cookie-extension.mjs

      - name: Build ASR runtime bundle
        shell: pwsh
        run: |
          npm run build-asr-runtime

      # TIMEOUT AND RETRY, because this step HUNG THE WHOLE RELEASE.
      #
      # Measured 2026-10-15, run 38779549411: release-build sat on THIS step
      # for 35+ minutes with every later step still "pending", including the
      # manifest step I had just fixed. Invoke-WebRequest has NO default
      # timeout in PowerShell 7, and go.microsoft.com is a fwlink redirector
      # that does not always answer - so the job waits forever and the run
      # never concludes, which looks exactly like a slow build.
      #
      # This also explains why the earlier failures looked inconsistent: this
      # download SUCCEEDED in v1.0.54/55/57/58 (letting them reach the manifest
      # step and fail there) and simply did not answer for v1.0.59. A release
      # step with no deadline turns a flaky CDN into an eternal job.
      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          $out = "installer\MicrosoftEdgeWebview2Setup.exe"
          $uri = "https://go.microsoft.com/fwlink/?linkid=2124703"
          $ok = $false
          foreach ($attempt in 1..3) {
            try {
              Write-Host "attempt $attempt : downloading WebView2 bootstrapper"
              # -TimeoutSec is per attempt. The default is infinite.
              Invoke-WebRequest -Uri $uri -OutFile $out -TimeoutSec 90
              $ok = $true
              break
            } catch {
              Write-Warning "attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $ok -or -not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) {
            # Fail LOUDLY and FAST rather than hanging. The installer bundles
            # this file, so a missing or truncated one must not reach ISCC.
            throw "WebView2 bootstrapper unavailable after 3 attempts"
          }
          Write-Host ("WebView2 bootstrapper: {0:N0} bytes" -f (Get-Item $out).Length)

      - name: Package Windows zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\VOD-RIP\* `
            -DestinationPath "release\VOD.RIP-$ver-win-x64.zip" -Force

      - name: Package ASR runtime zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $runtime = "dist\runtimes\asr\$ver"
          if (Test-Path (Join-Path $runtime "VOD-RIP-ASR.exe")) {
            Compress-Archive -Path "$runtime\*" `
              -DestinationPath "release\VOD-RIP-ASR-$ver-win-x64.zip" -Force
            Write-Host "Packaged ASR runtime v$ver"
          } else {
            Write-Warning "No ASR runtime at $runtime — skipping ASR zip (base still built)"
          }

      # Guarded on the artifact, exactly like the packaging step above. Two
      # tags (v1.0.54, v1.0.55) died on an unguarded version of this step:
      # the script threw (v1.0.54), then a rewritten script that exits 0 with
      # the warning on stdout STILL failed the step (v1.0.55) for a reason
      # never proven - the pwsh wrapper semantics around a native command.
      # So stop depending on those semantics for the ABSENT case: when there
      # is no runtime to describe, the step does not run at all. When there
      # IS one, it runs and must succeed, because a manifest for a real
      # archive is what the installer verifies against.
      - name: Write ASR runtime manifest
        if: hashFiles('dist/runtimes/asr/**/VOD-RIP-ASR.exe') != ''
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          node scripts/write-asr-runtime-manifest.mjs $ver

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Remove-Item -Recurse -Force installer\staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path installer\staging | Out-Null
          Copy-Item -Path dist\VOD-RIP\* -Destination installer\staging -Recurse -Force
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$ver installer\installer.iss

      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Sort-Object Name
          $lines = $files | ForEach-Object {
            "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)"
          }
          $lines | Set-Content release\SHA256SUMS.txt

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: vod-rip-Windows-x64
          path: |
            release/*.zip
            release/*-Setup.exe
            release/*-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vod-rip-Windows-x64
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
