name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
          npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Frontend unit tests
        run: npx vitest run
      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check backend/
      - name: Python syntax check
        run: python -m compileall -q backend
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      - name: Verify requirements.lock is up-to-date
        run: |
          pip install pip-tools
          pip-compile --strip-extras backend/requirements.txt -o /tmp/requirements-check.txt 2>/dev/null || true
          # Diff only the package names+versions (strip comments/whitespace)
          diff <(grep -E "^[a-zA-Z]" requirements.lock | sort) <(grep -E "^[a-zA-Z]" /tmp/requirements-check.txt | sort) || echo "::warning::requirements.lock may be out of sync with requirements.txt"
      - name: Playwright e2e smoke test
        if: always()
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e 2>&1 || echo "::warning::Playwright e2e had failures (non-blocking)"

  e2e-frame-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci
      - name: Playwright frame-mode + live-badge e2e
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e:frame-live
