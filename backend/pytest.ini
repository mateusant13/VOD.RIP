[pytest]
asyncio_mode = auto
testpaths = tests
# Live network/env suites (test_*_real*.py and @pytest.mark.network) are
# opt-in: run with `pytest -m real` / `pytest -m network`. Explicitly
# invoking a *_real* file auto-enables it (see conftest.py).
addopts = -m "not real and not network"
markers =
    real: live network/environment tests (YouTube/Twitch/Kick/CDN, tokens) — opt-in
    network: real-network tests (YouTube HLS, live endpoints) — opt-in
