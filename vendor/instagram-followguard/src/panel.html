<!doctype html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>IG FollowGuard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="panel">
  <header>
    <img src="images/icon128.png" alt="" />
    <div class="title">IG FollowGuard<small>gerenciador de seguidores</small></div>
    <span id="pill" class="pill"><span id="pill-text">…</span></span>
    <button id="refresh" class="btn ghost" title="Sincronizar agora">↻</button>
    <button id="close" class="btn ghost" title="Fechar">✕</button>
  </header>

  <div id="sync-hint" class="sync-hint" style="display:none" role="status">
    <strong>Não feche a aba do Instagram</strong> enquanto sincroniza.
  </div>

  <div id="error" class="error" style="display:none">
    <div id="err-text"></div>
    <button id="err-btn">Tentar de novo</button>
  </div>

  <div class="summary">
    <div class="card k" id="card-k"><b class="count">–</b><span>não seguem de volta</span></div>
    <div class="card" id="card-f"><b class="count">–</b><span>seguidores</span></div>
    <div class="card" id="card-m"><b class="count">–</b><span>seguindo</span></div>
  </div>

  <div id="tabs" class="tabs"></div>
  <div class="search"><input id="search" type="text" placeholder="Buscar conta…" autocomplete="off" /></div>
  <div id="toolbar" class="toolbar"></div>

  <div id="list" class="list"></div>

  <footer>
    <div class="foot-row">
      <span id="last-sync" class="meta"></span>
      <a id="open-ig" class="profile-link" href="#">abrir instagram.com</a>
    </div>
    <div class="settings">
      <label>Sincronizar a cada
        <select id="interval">
          <option value="30">30 min</option>
          <option value="60">1 h</option>
          <option value="180">3 h</option>
          <option value="360">6 h</option>
          <option value="720">12 h</option>
          <option value="1440">1 dia</option>
        </select>
      </label>
      <label><input type="checkbox" id="notif" /> notificações</label>
    </div>
    <div class="settings backup-row">
      <button type="button" id="export-backup" class="btn ghost tiny">Exportar backup</button>
      <label class="btn ghost tiny import-label">Importar backup
        <input type="file" id="import-backup" accept=".json,application/json" hidden />
      </label>
      <span class="backup-hint">Guarde antes de reinstalar — o Chrome não migra dados entre instalações.</span>
    </div>
    <div class="settings privacy-row">
      <p class="privacy-note">Ao sincronizar, seus dados de seguidores ficam apenas neste navegador.</p>
      <button type="button" id="delete-data" class="btn ghost danger">Apagar todos os dados</button>
    </div>
    <div id="meta" class="meta"></div>
  </footer>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
