<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
  #v { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
</style>
</head>
<body>
<!-- pre.js must load FIRST, before the vendored engines: MV3 extension_pages
     CSP (script-src 'self') forbids inline scripts, so the console silencing
     that used to live in an inline <script> never ran — dead code AND a CSP
     violation (its refusal error hit the very badge it was meant to keep
     clean). The HLS-mode native-controls flag moved into player-bridge.js. -->
<script src="pre.js"></script>
<video id="v" autoplay playsinline></video>
<script src="ivs/index.js"></script>
<script src="hls/hls.min.js"></script>
<script src="player-bridge.js"></script>
</body>
</html>
