[pytest]
# Tools-suite pytest root. Deliberately its own root, separate from
# backend/pytest.ini: that one sets `testpaths = tests` and is resolved from
# backend/, so a suite under tools/ is never collected by a bare `pytest`.
# Without this file the 17 tests in tools/tests/ run only when named
# explicitly, which means they stop being run at all the moment someone
# forgets the path.
#
# This is a tools/ file on purpose -- it does not touch backend/.
testpaths = tests
# The archiver tests build throwaway git repos and hold files open with
# helper subprocesses. They are not network or live-environment tests, so
# they are NOT marked real/network and run by default.
addopts = -q --no-header
